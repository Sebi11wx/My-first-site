<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div>
    <div class="section">
  <div class="navbar">
    <nav>
  <span class="logo-text">
  <i class="fa-solid fa-music"></i> 
  </span>
</nav>
    <div class="logo"><span class="gradient-text">Toze songs</span></div>
     <div class="nav-links">
      <button class="home" data-fmt="home">Home</button>
      <button class="about" data-fmt="about">About</button> 
      <button class="contact" data-fmt="contact">Contact</button>
     </div>
   </div>
     <div class="header">
        <h1 class="container">Welcome to <span class="gradient-texts">Toze songs</span> </h1>
        <p class="text">Our <span class="grand">peace</span> is in <span class="grand">music</span>.</p>
        <p class="text">Enjoy our libraries of songs that you can convert in various formats.</p>
     </div>
     </div> 
    <div class="main-section">
      <main>
<p class="texts" style="margin-top: 20px;">Enter the spotify url of the song you want to download and select the format you want to convert it to.</p>
     <script src="script.js"></script>
      <div class="card">
      <label>spotify url</label>
       <!-- From Uiverse.io by Galahhad --> 
<label class="search-label">
    <input type="text" id="urlInput" placeholder="https://open.spotify.com/track/..." />
    <kbd class="slash-icon">/</kbd>
    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" x="0" y="0" viewBox="0 0 56.966 56.966" style="enable-background:new 0 0 512 512" xml:space="preserve">
      <g>
        <path d="M55.146 51.887 41.588 37.786A22.926 22.926 0 0 0 46.984 23c0-12.682-10.318-23-23-23s-23 10.318-23 23 10.318 23 23 23c4.761 0 9.298-1.436 13.177-4.162l13.661 14.208c.571.593 1.339.92 2.162.92.779 0 1.518-.297 2.079-.837a3.004 3.004 0 0 0 .083-4.242zM23.984 6c9.374 0 17 7.626 17 17s-7.626 17-17 17-17-7.626-17-17 7.626-17 17-17z" fill="currentColor" data-original="#000000" class=""></path>
      </g>
    </svg>
  </label>
      <label>format</label>
      <div class="formats">
        <button class="fmt active" data-fmt="mp3">mp3</button>
        <button class="fmt" data-fmt="m4a">m4a</button>
        <button class="fmt" data-fmt="ogg">ogg</button>
      </div>
    
     <div>
      <button id="downloadBtn" onclick="startDownload()">⬇ download</button>
      
    </div>

    <div class="card" id="infoCard" style="display:none">
      <div id="trackInfo"></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <p id="status" class="status"></p>
    </div>
  </main>
 </div>
   
 <footer class="footer">
    <p>Made with ❤️ by <a href="https://github.com/sebi11wx" target="_blank">Sebi11wx</a></p>
  </footer>
  <script>
    let selectedFormat = 'mp3';

    document.querySelectorAll('.fmt').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.fmt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedFormat = btn.dataset.fmt;
      });
    });

    async function startDownload() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;

      const infoCard = document.getElementById('infoCard');
      const status = document.getElementById('status');
      const fill = document.getElementById('progressFill');
      const trackInfo = document.getElementById('trackInfo');

      infoCard.style.display = 'block';
      status.textContent = 'looking up track...';
      fill.style.width = '10%';

      // Fetch track info
      const info = await fetch('/api/info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url })
      }).then(r => r.json());

      if (info.error) { status.textContent = info.error; return; }

      trackInfo.innerHTML = `<strong>${info.title}</strong><br><span>${info.artist} · ${info.album}</span>`;
      status.textContent = 'downloading...';
      fill.style.width = '40%';

      // Download
      const res = await fetch('/api/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url, format: selectedFormat })
      });

      if (!res.ok) { status.textContent = 'download failed.'; return; }

      fill.style.width = '100%';
      status.textContent = 'done!';

      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${info.artist} - ${info.title}.${selectedFormat}`;
      a.click();
    }
    </script>
   <script>lucide.createIcons();</script>
</body>
</html>
